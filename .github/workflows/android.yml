name: Build app

# Builds the installable app on every push to main and publishes it as the
# "latest" release, which the phones' Update button points to.
on:
  push:
    branches: [main]
    paths-ignore: ['scripts/**', '.github/workflows/data.yml', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KS: ${{ secrets.POKESTOCK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/pokestock.jks"
            echo "POKESTOCK_KEYSTORE=$RUNNER_TEMP/pokestock.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret yet; building with a throwaway debug key"
          fi
      - name: Build
        env:
          POKESTOCK_KEYSTORE_PASSWORD: ${{ secrets.POKESTOCK_KEYSTORE_PASSWORD }}
          POKESTOCK_KEY_ALIAS: ${{ secrets.POKESTOCK_KEY_ALIAS }}
          POKESTOCK_KEY_PASSWORD: ${{ secrets.POKESTOCK_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they can be read without the full log.
            grep -E '^e: ' build.log | head -40 | while read -r line; do echo "::error::$line"; done
            grep -A8 'What went wrong' build.log | head -30 | tr '\n' ' ' | sed 's/^/::error::/'; echo
            exit 1
          }
      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk Pokestock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pokestock
          path: Pokestock.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pokestock 0.1.${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: Pokestock.apk
          make_latest: true
